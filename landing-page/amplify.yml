version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd warped-mirrors/landing-page
        - npm ci
    build:
      commands:
        - cd warped-mirrors/landing-page
        - npm run build
  artifacts:
    baseDirectory: warped-mirrors/landing-page/dist
    files:
      - '**/*'
  cache:
    paths:
      - warped-mirrors/landing-page/node_modules/**/*
